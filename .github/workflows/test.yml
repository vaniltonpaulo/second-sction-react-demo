name: Test Project
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install NodeJs
        uses: actions/setupnode@v3
        with:
          node-version: 18
      - name: Install dependecies
        run: npm ci 
      - name: Run tests
        run: pm test     